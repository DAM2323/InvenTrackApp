<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InvenTrack · MVP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='20 20 160 160'%3E%3Cpath d='M100 38L154 69L100 100L46 69Z' fill='%235BA8FF'/%3E%3Cpath d='M46 69L100 100L100 162L46 131Z' fill='%231D6FE8'/%3E%3Cpath d='M154 69L100 100L100 162L154 131Z' fill='%230F2A43'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1B2B; --navy2:#0F2A43; --blue:#1D6FE8; --sky:#5BA8FF; --teal:#14D3B0;
  --bg:#F3F6FB; --card:#FFFFFF; --ink:#0F2A43; --mut:#5B6B7C; --line:#E3E9F1;
  --ok:#0E9F6E; --okbg:#DDF7EC; --warn:#B7791F; --warnbg:#FFF1CC; --bad:#D6336C; --badbg:#FFE1EA; --info:#1D6FE8; --infobg:#E2EEFF;
  --r:14px; --sh:0 1px 2px rgba(15,42,67,.06),0 8px 24px rgba(15,42,67,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,'Segoe UI',system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
/* layout */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,#0B1B2B 0%,#0F2A43 100%);color:#C9D6E4;padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.side .logo{padding:2px 6px 18px}
.side .logo img,.side .logo svg{width:100%;max-width:190px;height:auto;display:block}
.side h6{margin:14px 10px 6px;font-size:10.5px;letter-spacing:.14em;color:#6F88A3;font-weight:700;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#C9D6E4;text-decoration:none;font-weight:500;transition:.15s}
.nav a svg{width:19px;height:19px;flex:none;opacity:.9}
.nav a:hover{background:rgba(91,168,255,.12);color:#fff}
.nav a.on{background:linear-gradient(90deg,rgba(29,111,232,.95),rgba(29,111,232,.55));color:#fff;box-shadow:0 6px 18px rgba(29,111,232,.35)}
.nav a small{margin-left:auto;font-size:10.5px;background:rgba(255,255,255,.12);border-radius:6px;padding:1px 7px;font-weight:700}
.side .foot{margin-top:auto;font-size:12px;color:#7F97B1;padding:12px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(255,255,255,.04)}
.side .foot b{color:#fff}
main{min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:16px 28px;background:rgba(243,246,251,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
.top .crumb{font-size:12px;color:var(--mut);font-weight:600;letter-spacing:.04em}
.top h1{margin:0;font-size:21px;letter-spacing:-.02em}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px;box-shadow:var(--sh);font-weight:600;font-size:12.5px}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
.role{font-weight:600;color:var(--mut);font-size:11.5px}
.content{padding:24px 28px 60px;max-width:1500px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card h2{margin:0 0 4px;font-size:16px;letter-spacing:-.01em}
.card .sub{color:var(--mut);font-size:12.5px;margin-bottom:14px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1.25fr 1fr}.g2b{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:12px;align-items:center}.wrap{flex-wrap:wrap}
.sp1{flex:1}
/* forms */
label{white-space:nowrap;display:block;font-size:11.5px;font-weight:700;color:#35506B;margin-bottom:5px;letter-spacing:.02em}
label i{font-style:normal;font-weight:500;color:#8A9BB0;font-family:'JetBrains Mono',monospace;font-size:10.5px;margin-left:4px}
select,input[type=text],input[type=number],input[type=date]{width:100%;border:1px solid #CBD6E3;border-radius:10px;padding:9px 11px;background:#fff;font:inherit;color:var(--ink);outline:none;transition:.15s}
select:focus,input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,111,232,.15)}
.fld{margin-bottom:12px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(29,111,232,.28);transition:.15s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn.ok{background:var(--ok);box-shadow:0 6px 16px rgba(14,159,110,.28)}
.btn.bad{background:var(--bad);box-shadow:0 6px 16px rgba(214,51,108,.25)}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid #BCD3F7;box-shadow:none}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:16px;height:16px}
/* badges */
.tag{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700}
.t-ok{background:var(--okbg);color:#077a53}.t-warn{background:var(--warnbg);color:#8a5b00}.t-bad{background:var(--badbg);color:#b3124f}.t-info{background:var(--infobg);color:#1558c0}.t-mut{background:#EEF2F7;color:#51657A}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
/* tables */
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#6B7F95;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
td{white-space:normal;padding:11px 10px;border-bottom:1px solid #EEF2F7;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.pn{display:flex;align-items:center;gap:11px;min-width:0}.pn>div{min-width:0}.line .pic{width:32px;height:32px;border-radius:9px}.line .pic svg{width:19px;height:19px}.flow text,.chart text{font-family:Inter,'Segoe UI',Arial,sans-serif}
.pn b{display:block;font-size:13.5px}.pn span{color:var(--mut);font-size:11.5px}
.pic{width:42px;height:42px;border-radius:11px;flex:none;display:grid;place-items:center}
.pic svg{width:26px;height:26px}
/* product cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.pc{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;transition:.15s;display:flex;flex-direction:column;gap:6px}
.pc:hover{border-color:#9CC1F5;box-shadow:0 8px 22px rgba(29,111,232,.12);transform:translateY(-2px)}
.pc .pic{width:100%;height:84px;border-radius:11px}.pc .pic svg{width:46px;height:46px}
.pc b{font-size:13px}.pc .pr{font-weight:800;font-size:15px;color:var(--ink)}
.pc .st{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}.pc .pr{white-space:nowrap}
/* kpi */
.kpi{display:flex;gap:14px;align-items:center}
.kpi .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:none}
.kpi .ic svg{width:24px;height:24px}
.kpi b{font-size:26px;letter-spacing:-.03em;display:block;line-height:1.1}.kpi span{color:var(--mut);font-size:12.5px;font-weight:600}
/* hero */
.hero{border-radius:20px;padding:30px 34px;color:#fff;background:radial-gradient(900px 300px at 85% -10%,rgba(91,168,255,.45),transparent 60%),linear-gradient(120deg,#0B1B2B,#0F2A43 55%,#12467f);position:relative;overflow:hidden;display:grid;grid-template-columns:.95fr 1.1fr;gap:20px;align-items:center;box-shadow:0 18px 40px rgba(11,27,43,.25)}
.hero h2{font-size:27px;margin:0 0 10px;letter-spacing:-.02em;line-height:1.2}
.hero p{margin:0 0 18px;color:#B8CBE0;font-size:14.5px;max-width:520px}
.hero .pill{display:inline-block;background:rgba(20,211,176,.15);color:#6CF0D6;border:1px solid rgba(20,211,176,.35);border-radius:999px;padding:4px 12px;font-size:11.5px;font-weight:800;letter-spacing:.08em;margin-bottom:12px}
.hero .btn.ghost{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.25)}
.flow{width:100%}
/* hu cards on home */
.hucard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;transition:.15s;position:relative;overflow:hidden}
.hucard:hover{transform:translateY(-3px);border-color:#9CC1F5}
.hucard .n{font-weight:800;font-size:12px;color:var(--blue);letter-spacing:.1em}
.hucard h3{margin:0;font-size:15.5px}
.hucard p{margin:0;color:var(--mut);font-size:12.5px}
.hucard .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--infobg);color:var(--blue)}
.hucard .ic svg{width:21px;height:21px}
/* lines / cart */
.line{display:grid;grid-template-columns:1fr 58px 100px 58px 28px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.line input{padding:6px 8px;text-align:right}
.line .x{border:0;background:#fff0f4;color:var(--bad);border-radius:8px;width:28px;height:28px;font-weight:800}
.lh{display:grid;grid-template-columns:1fr 58px 100px 58px 28px;gap:8px;font-size:10.5px;color:#7a8da3;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding-bottom:6px}
.line span{white-space:nowrap}.pc button{margin-top:auto}.line.l3,.lh.l3{grid-template-columns:1fr 90px 30px}
.line.l4,.lh.l4{grid-template-columns:1fr 78px 92px 30px}
.total{display:flex;justify-content:space-between;align-items:center;padding:14px 0 4px;font-size:15px}
.total b{font-size:24px;letter-spacing:-.02em}
.alert{border-radius:10px;padding:10px 12px;font-size:12.5px;font-weight:600;margin:10px 0;display:flex;gap:9px;align-items:flex-start}
.alert.bad{background:var(--badbg);color:#8d1040}.alert.ok{background:var(--okbg);color:#066a47}.alert.info{background:var(--infobg);color:#164f9f}
details.json{margin-top:12px;border:1px solid var(--line);border-radius:10px;background:#0B1B2B;color:#cfe3ff}
details.json summary{cursor:pointer;padding:9px 12px;font-size:12px;font-weight:700;color:#9FC4F5;list-style:none;display:flex;align-items:center;gap:8px}
details.json pre{margin:0;padding:4px 14px 14px;font-size:11.5px;line-height:1.55;overflow:auto;max-height:260px;color:#BFE0FF}
/* stepper */
.steps{display:flex;align-items:center;gap:0;margin:8px 0}
.steps .s{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:#8a9bb0}
.steps .c{width:22px;height:22px;border-radius:50%;border:2px solid #CBD6E3;display:grid;place-items:center;background:#fff;font-size:11px}
.steps .bar{height:2px;width:34px;background:#CBD6E3;margin:0 6px}
.steps .s.d{color:var(--ok)}.steps .s.d .c{background:var(--ok);border-color:var(--ok);color:#fff}
.steps .s.n{color:var(--blue)}.steps .s.n .c{border-color:var(--blue);color:var(--blue)}
.steps .bar.d{background:var(--ok)}
.tcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff}
.tcard .hd{display:flex;align-items:center;gap:10px}
.route{display:flex;align-items:center;gap:8px;font-weight:700}
.route svg{width:18px;height:18px;color:var(--blue)}
/* stock bar */
.bar{height:8px;border-radius:99px;background:#E9EFF6;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;border-radius:99px}
/* timeline */
.tl{position:relative;padding-left:26px}
.tl:before{content:'';position:absolute;left:10px;top:6px;bottom:6px;width:2px;background:#DDE6F0}
.ev{position:relative;padding:8px 0 14px}
.ev .pt{position:absolute;left:-26px;top:9px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;box-shadow:0 0 0 4px #fff}
.ev .pt.in{background:var(--ok)}.ev .pt.out{background:var(--bad)}
.ev .h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ev .m{color:var(--mut);font-size:12px}
/* chips filter */
.seg{display:inline-flex;background:#EAF0F8;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:700;color:#4a6179;font-size:12.5px}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 4px rgba(15,42,67,.12)}
/* toast */
#toasts{position:fixed;right:22px;top:76px;z-index:60;display:flex;flex-direction:column;gap:10px;width:380px;max-width:calc(100vw - 30px)}
.toast{background:#0B1B2B;color:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 14px 34px rgba(11,27,43,.35);display:flex;gap:12px;animation:in .25s ease}
.toast .code{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;border-radius:7px;padding:3px 8px;height:fit-content;white-space:nowrap}
.toast .code.s{background:rgba(20,211,176,.18);color:#6CF0D6}.toast .code.e{background:rgba(255,110,150,.18);color:#ff9bb8}
.toast b{display:block;font-size:13.5px}.toast span{color:#a9bfd6;font-size:12.5px}
/* login */
.login{display:none;min-height:100vh;grid-template-columns:1.05fr 1fr;background:var(--bg)}
body.anon .login{display:grid} body.anon .app{display:none}
.login .brand{background:linear-gradient(160deg,#0B1B2B 0%,#0F2A43 60%,#12406b 100%);color:#C9D6E4;padding:48px 56px;display:flex;flex-direction:column;gap:18px;justify-content:center}
.login .brand svg,.login .brand img{max-width:300px;height:auto}
.login .brand h2{margin:10px 0 0;color:#fff;font-size:28px;letter-spacing:-.02em;line-height:1.2}
.login .brand p{margin:0;max-width:430px;color:#9fb6cf;font-size:15px}
.login .brand .pill{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;color:#6CF0D6;width:fit-content}
.login .box{display:grid;place-items:center;padding:32px}
.login .lc{width:100%;max-width:430px}
.login .lc h1{margin:0 0 4px;font-size:26px;letter-spacing:-.02em}
.login .lc .sub{color:var(--mut);margin-bottom:18px}
.login input[type=password],.login input[type=email]{width:100%;border:1px solid #CBD6E3;border-radius:10px;padding:11px 12px;background:#fff;font:inherit;color:var(--ink);outline:none}
.login input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,111,232,.15)}
.login .btn{width:100%;justify-content:center;padding:12px 16px;margin-top:6px}
.login .demo{margin-top:18px;font-size:12px;color:var(--mut)}
.login .demo button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;margin:4px 6px 0 0;font-size:12px;font-weight:600;color:var(--ink)}
.login .demo button:hover{border-color:var(--blue);color:var(--blue)}
.login .err{display:none;background:var(--badbg);color:#9b1c4c;border-radius:10px;padding:10px 12px;font-weight:600;font-size:13px;margin-bottom:12px}
.login .err.on{display:block}
.jwtchip{font-size:11px;color:var(--mut);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 10px;cursor:default}
.outbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;color:var(--ink)}
.outbtn:hover{border-color:var(--bad);color:var(--bad)}
@media(max-width:860px){.login{grid-template-columns:1fr}.login .brand{padding:28px}}
@keyframes in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.reset{margin-top:6px;background:transparent;color:rgba(159,182,207,.14);border:0;border-radius:6px;padding:4px 8px;font-size:10px;font-weight:600;align-self:flex-start;transition:.2s}
.reset:hover{color:rgba(159,182,207,.75);background:rgba(255,255,255,.06)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);font-weight:600;flex-wrap:wrap}
.legend span:before{content:'';display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;background:var(--c)}
@media(max-width:1180px){.g2,.g2b,.hero{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:relative;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px}.side .logo{width:100%;padding:0 0 6px}.side h6,.side .foot,.reset{display:none}.nav{display:flex;flex-wrap:wrap;gap:4px}.nav a{padding:8px 10px;font-size:12.5px}.nav a small{display:none}.content{padding:16px}.top{padding:12px 16px;flex-wrap:wrap}.g3,.g4{grid-template-columns:1fr}.line,.lh{grid-template-columns:1fr 64px 80px 64px 26px}}
</style>
</head>
<body class="anon">
<div class="login" id="login"></div>
<div class="app">
  <aside class="side">
    <div class="logo" id="logo"></div>
    <h6>Core del negocio</h6>
    <nav class="nav" id="nav"></nav>
    <div class="foot">Cada <b>venta</b>, <b>compra</b> y <b>traslado</b> actualiza el stock de la sucursal y deja registro en el kárdex.</div>
    <button class="reset" id="reset" title="Restablecer datos de la demo">↺ Restablecer datos</button>
  </aside>
  <main>
    <div class="top">
      <div><div class="crumb" id="crumb"></div><h1 id="title"></h1></div>
      <div class="sp"></div>
      <div class="chip" id="who"></div>
      <button class="outbtn" id="out">Cerrar sesión</button>
    </div>
    <div class="content" id="view"></div>
  </main>
</div>
<div id="toasts"></div>

function vReg(){
 if(!S.cart.length){S.alertV={ok:false,t:'Agrega al menos un producto.'};return render()}
 for(const l of S.cart){const q=stock(S.vSuc,l.prod);if(l.qty>q){const m=`Stock insuficiente para el producto ${l.prod}. Disponible: ${q}`;S.alertV={ok:false,t:'<b>400 Bad Request</b> · '+m};toast('400','Venta rechazada',m,false);return render()}}
 const id=Math.max(...S.vt.map(v=>v.id))+1,total=cartTotal();
 S.vt.push({id,cli:+S.vCli,suc:S.vSuc,usr:ME().id,mp:+S.vMp,fecha:now(),total,estado:'Registrada',det:S.cart.map(l=>({prod:l.prod,qty:l.qty,pu:P(l.prod).pv,dsc:l.dsc}))});
 S.cart.forEach(l=>{addStock(S.vSuc,l.prod,-l.qty);addMov(l.prod,ME().id,S.vSuc,'Salida',l.qty,'Venta')});
 S.alertV={ok:true,t:`<b>201 Created</b> · Venta #${id} registrada por ${money(total)}. El stock bajó en la sucursal.`};
 toast('201','Venta registrada',`idVenta ${id} · total ${money(total)}`);S.cart=[];render();
}

 <div class="card" style="align-self:start"><div class="row"><div class="sp1"><h2>Órdenes de compra</h2><div class="sub" style="margin:0">Confirma la recepción cuando llega la mercadería.</div></div><div class="seg">${['Todas','Pendiente','Recibida'].map(f=>`<button class="${S.cFilter==f?'on':''}" data-act="c-f" data-f="${f}">${f}</button>`).join('')}</div></div>
 <table style="margin-top:8px"><tr><th>N°</th><th>Proveedor</th><th>Destino</th><th class="num">Total</th><th>Estado</th><th></th></tr>${list.map(x=>`<tr><td class="mono">#${x.id}</td><td style="font-size:12.5px">${esc(S.prv.find(p=>p.id==x.prv).nombre)}</td><td>${SU(x.suc).nombre}</td><td class="num"><b>${money(x.total)}</b></td><td><span class="tag ${x.estado=='Pendiente'?'t-warn':'t-ok'}">${x.estado}</span></td><td class="num">${x.estado=='Pendiente'?`<button class="btn sm ok" data-act="c-rec" data-id="${x.id}">Confirmar recepción</button>`:`<button class="btn sm ghost" data-act="c-rec" data-id="${x.id}">Reintentar</button>`}</td></tr>`).join('')}</table></div></div>`;

function cReg(){
 const o=S.cOrd,prv=S.prv.find(p=>p.id==o.prv);
 if(!prv.activo){const m='El proveedor especificado no se encuentra habilitado';S.alertC={ok:false,t:'<b>400 Bad Request</b> · '+m};toast('400','Orden rechazada',m,false);return render()}
 if(!o.lines.length){S.alertC={ok:false,t:'Agrega al menos un producto.'};return render()}
 const id=Math.max(...S.oc.map(x=>x.id))+1,total=o.lines.reduce((a,l)=>a+l.qty*l.pu,0);
 S.oc.push({id,prv:+o.prv,suc:+o.suc,usr:ME().id,fecha:now(),total,estado:'Pendiente',obs:o.obs,det:o.lines.map(l=>({prod:l.prod,qty:l.qty,pu:l.pu}))});
 S.alertC={ok:true,t:`<b>201 Created</b> · Orden #${id} en estado Pendiente. El stock aún no cambia.`};toast('201','Orden registrada',`idCompra ${id} · ${money(total)} · Pendiente`);render();
}
function cRec(id){
 const x=S.oc.find(o=>o.id==id);
 if(x.estado=='Recibida'){toast('409','Conflict','La orden ya ha sido recibida previamente',false);return}
 x.estado='Recibida';x.det.forEach(d=>{addStock(x.suc,d.prod,d.qty);addMov(d.prod,ME().id,x.suc,'Entrada',d.qty,'Compra')});
 toast('200','Mercadería recibida con éxito',`Orden #${id} · el stock de ${SU(x.suc).nombre} aumentó`);render();
}

function tReg(){
 const t=S.tNew;
 if(+t.o==+t.d){const m='La sucursal de origen y destino deben ser distintas';S.alertT={ok:false,t:'<b>400 Bad Request</b> · '+m};toast('400','Traslado rechazado',m,false);return render()}
 if(!t.lines.length){S.alertT={ok:false,t:'Agrega al menos un producto.'};return render()}
 const id=Math.max(...S.tr.map(x=>x.id))+1;
 S.tr.push({id,o:+t.o,d:+t.d,usr:ME().id,fecha:now(),estado:'Pendiente',obs:t.obs,det:t.lines.map(l=>({prod:l.prod,qty:l.qty}))});
 S.alertT={ok:true,t:`<b>201 Created</b> · Traslado #${id} en estado Pendiente. El stock aún no cambia.`};toast('201','Traslado registrado',`idTraslado ${id} · Pendiente`);render();
}
function tEnv(id){
 const x=S.tr.find(t=>t.id==id);
 if(x.estado!='Pendiente'){toast('409','Conflict','El traslado ya fue enviado',false);return}
 for(const d of x.det){const q=stock(x.o,d.prod);if(d.qty>q){toast('400','Stock insuficiente en la sucursal de origen',`${P(d.prod).nombre}: disponible ${q}, solicitado ${d.qty}`,false);return}}
 x.estado='Enviado';x.det.forEach(d=>{addStock(x.o,d.prod,-d.qty);addMov(d.prod,x.usr,x.o,'Salida',d.qty,'Traslado')});
 toast('200','Traslado enviado y stock descontado en el origen',`#${id} · ${SU(x.o).nombre} → ${SU(x.d).nombre}`);render();
}
function tRec(id){
 const x=S.tr.find(t=>t.id==id);
 if(x.estado=='Pendiente'){toast('409','Conflict','El traslado aún no ha sido enviado',false);return}
 if(x.estado=='Recibido'){toast('409','Conflict','El traslado ya fue recibido',false);return}
 x.estado='Recibido';x.det.forEach(d=>{addStock(x.d,d.prod,d.qty);addMov(d.prod,x.usr,x.d,'Entrada',d.qty,'Traslado')});
 toast('200','Traslado recibido y stock agregado en el destino',`#${id} · ${SU(x.d).nombre}`);render();
}

/* ---------- HU05 ---------- */
function barChart(data){
 const W=640,H=250,pl=44,pb=34,max=Math.max(1,...data.map(d=>d.total))*1.12,bw=Math.min(54,(W-pl-10)/data.length-16);
 const y=v=>H-pb-(v/max)*(H-pb-16);
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5BA8FF"/><stop offset="1" stop-color="#1D6FE8"/></linearGradient></defs>
 ${[0,.25,.5,.75,1].map(f=>{const v=max*f;return `<line x1="${pl}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="#E6ECF4"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="#7A8DA3" font-family="Inter">${Math.round(v)}</text>`}).join('')}
 ${data.map((d,k)=>{const x=pl+12+k*((W-pl-20)/data.length)+((W-pl-20)/data.length-bw)/2;return `<rect x="${x}" y="${y(d.total)}" width="${bw}" height="${H-pb-y(d.total)}" rx="7" fill="url(#bg)"/><text x="${x+bw/2}" y="${y(d.total)-7}" text-anchor="middle" font-size="11" font-weight="700" fill="#0F2A43" font-family="Inter">${d.total.toLocaleString('es-PE',{maximumFractionDigits:0})}</text><text x="${x+bw/2}" y="${H-12}" text-anchor="middle" font-size="11" fill="#5B6B7C" font-family="Inter">${d.dia.slice(8)}/${d.dia.slice(5,7)}</text>`}).join('')}</svg>`;
}
function salesByDay(){const m={};S.vt.filter(v=>v.estado=='Registrada'&&v.fecha.slice(0,10)>=S.rDesde&&v.fecha.slice(0,10)<=S.rHasta&&(!S.rSuc||v.suc==S.rSuc)).forEach(v=>{const d=v.fecha.slice(0,10);m[d]=(m[d]||0)+v.total});return Object.keys(m).sort().map(d=>({dia:d,total:m[d]}))}
function hu05(){
 const ev=S.mv.filter(m=>m.prod==S.kProd&&m.suc==S.kSuc).sort((a,b)=>a.fecha<b.fecha?-1:1);let saldo=0;
 const evs=ev.map(m=>{saldo+=m.tipo=='Entrada'?m.qty:-m.qty;return{...m,saldo}});
 const sales=salesByDay(),tot=sales.reduce((a,d)=>a+d.total,0);
 return `<div class="grid g2b"><div class="card"><h2>Kárdex de un producto</h2><div class="sub">Historial de entradas y salidas, con el saldo después de cada movimiento.</div>
 <div class="row"><div class="fld sp1"><label>Producto <i>idProducto</i></label><select data-bind="kProd">${S.prod.map(p=>`<option value="${p.id}" ${p.id==S.kProd?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select></div><div class="fld sp1"><label>Sucursal <i>idSucursal</i></label><select data-bind="kSuc">${S.suc.map(s=>`<option value="${s.id}" ${s.id==S.kSuc?'selected':''}>${s.nombre}</option>`).join('')}</select></div></div>
 <div class="row" style="margin-bottom:14px;padding:12px;background:#F5F8FC;border-radius:12px">${pic(P(S.kProd))}<div class="sp1"><b>${esc(P(S.kProd).nombre)}</b><div style="color:var(--mut);font-size:12px">${SU(S.kSuc).nombre} · mínimo ${P(S.kProd).min}</div></div><div style="text-align:right"><div style="color:var(--mut);font-size:11px;font-weight:700">STOCK ACTUAL</div><b style="font-size:24px">${stock(S.kSuc,S.kProd)}</b></div></div>
 ${evs.length?`<div class="tl">${evs.map(m=>`<div class="ev"><div class="pt ${m.tipo=='Entrada'?'in':'out'}">${m.tipo=='Entrada'?'↑':'↓'}</div><div class="h"><b>${m.tipo=='Entrada'?'+':'−'}${m.qty} unidades</b><span class="tag ${m.motivo=='Venta'?'t-bad':m.motivo=='Compra'?'t-ok':m.motivo=='Traslado'?'t-info':'t-mut'}">${m.motivo}</span><span class="sp1"></span><span class="mono" style="font-size:12px;color:var(--mut)">saldo ${m.saldo}</span></div><div class="m">${m.fecha.slice(8,10)}/${m.fecha.slice(5,7)}/${m.fecha.slice(0,4)} ${m.fecha.slice(11,16)} · ${esc(US(m.usr).nombre)}</div></div>`).join('')}</div>`:'<div class="alert info">404 Not Found · No hay movimientos para ese producto en la sucursal.</div>'}</div>
 <div class="card" style="align-self:start"><h2>Reporte de ventas por día</h2><div class="sub">Total vendido en el período. Las ventas anuladas no se cuentan.</div>
 <div class="row"><div class="fld sp1"><label>Desde <i>desde</i></label><input type="date" data-bind="rDesde" value="${S.rDesde}"></div><div class="fld sp1"><label>Hasta <i>hasta</i></label><input type="date" data-bind="rHasta" value="${S.rHasta}"></div><div class="fld sp1"><label>Sucursal <i>idSucursal</i></label><select data-bind="rSuc"><option value="0">Todas</option>${S.suc.slice(0,5).map(s=>`<option value="${s.id}" ${s.id==S.rSuc?'selected':''}>${s.nombre}</option>`).join('')}</select></div></div>
 <div class="row" style="margin:6px 0 10px"><div class="sp1"><div style="color:var(--mut);font-size:11px;font-weight:700">TOTAL DEL PERÍODO</div><b style="font-size:26px;letter-spacing:-.02em">${money(tot)}</b></div><div class="legend"><span style="--c:#1D6FE8">Total vendido por día (S/)</span></div></div>
 ${sales.length?barChart(sales):'<div class="alert info">No hay ventas en el rango seleccionado.</div>'}
 <table style="margin-top:8px"><tr><th>Día</th><th class="num">Total vendido</th></tr>${sales.map(d=>`<tr><td>${d.dia.slice(8)}/${d.dia.slice(5,7)}/${d.dia.slice(0,4)}</td><td class="num"><b>${money(d.total)}</b></td></tr>`).join('')}</table></div></div>`;
}

/* ---------- eventos ---------- */
function setPath(path,val){const k=path.split('.');if(k.length==1){S[k[0]]=val}else{S[k[0]][k[1]]=val}}
function bind(){
 document.querySelectorAll('[data-bind]').forEach(el=>el.addEventListener('change',()=>{let v=el.value;const p=el.dataset.bind;if(['vCli','vMp','kProd','kSuc','rSuc','cOrd.prv','cOrd.suc','tNew.o','tNew.d'].includes(p))v=+v;setPath(p,v);if(p=='cOrd.prv'){S.cOrd.lines=[]}if(p=='tNew.o'){S.tNew.lines=[]}render()}));
 document.querySelectorAll('[data-line]').forEach(el=>el.addEventListener('change',()=>{S.cart[+el.dataset.line][el.dataset.f]=+el.value;render()}));
 document.querySelectorAll('[data-cline]').forEach(el=>el.addEventListener('change',()=>{S.cOrd.lines[+el.dataset.cline].qty=+el.value;render()}));
 document.querySelectorAll('[data-tline]').forEach(el=>el.addEventListener('change',()=>{S.tNew.lines[+el.dataset.tline].qty=+el.value;render()}));
 document.querySelectorAll('[data-act]').forEach(el=>el.addEventListener('click',()=>act(el.dataset,el)));
}
function act(d){
 const a=d.act;
 if(a=='v-add'){const l=S.cart.find(x=>x.prod==+d.p);if(l)l.qty++;else S.cart.push({prod:+d.p,qty:1,dsc:0});S.alertV=null;render()}
 else if(a=='v-del'){S.cart.splice(+d.k,1);render()}
 else if(a=='v-reg')vReg();else if(a=='v-anu')vAnu(+d.id);
 else if(a=='c-add'){const l=S.cOrd.lines.find(x=>x.prod==+d.p);if(l)l.qty++;else S.cOrd.lines.push({prod:+d.p,qty:1,pu:+d.pc});S.alertC=null;render()}
 else if(a=='c-del'){S.cOrd.lines.splice(+d.k,1);render()}
 else if(a=='c-reg')cReg();else if(a=='c-rec')cRec(+d.id);else if(a=='c-f'){S.cFilter=d.f;render()}
 else if(a=='t-add'){const l=S.tNew.lines.find(x=>x.prod==+d.p);if(l)l.qty++;else S.tNew.lines.push({prod:+d.p,qty:1});S.alertT=null;render()}
 else if(a=='t-del'){S.tNew.lines.splice(+d.k,1);render()}
 else if(a=='t-reg')tReg();else if(a=='t-env')tEnv(+d.id);else if(a=='t-rec')tRec(+d.id);
 else if(a=='i-suc'){S.iSuc=+d.id;render()}else if(a=='i-low'){S.iLow=d.v=='1';render()}
 else if(a=='i-edit'){S.iEdit=+d.id;render();const e=$('#ub');e&&e.focus()}
 else if(a=='i-save'){const i=S.inv.find(x=>x.id==+d.id);i.ubic=$('#ub').value||i.ubic;S.iEdit=null;toast('200','Ubicación actualizada',`${P(i.prod).nombre} → ${i.ubic}`);render()}
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
$('#reset').addEventListener('click',()=>{init();render();toast('200','Datos restablecidos','Se recargó la base de datos de ejemplo')});
$('#out').addEventListener('click',salir);
init();
try{const id=sessionStorage.getItem('mvpSesion');if(id&&US(+id)){const u=US(+id);SESSION={id:u.id,token:fakeJWT(u)};document.body.classList.remove('anon')}}catch(_){}
render();
</script>
</body>
</html>
